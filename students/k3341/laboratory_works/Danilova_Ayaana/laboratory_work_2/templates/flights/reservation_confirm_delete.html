{% extends "base.html" %}

{% block title %}Отмена бронирования{% endblock %}

{% block content %}
<div class="mx-auto my-4" style="max-width: 540px;">
    <div class="card p-4 p-md-5 text-center">
        <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center" style="width: 48px; height: 48px; border-radius: 14px; background: rgba(237, 109, 104, 0.14); color: var(--color-rose);">
            <i class="bi bi-ticket-detailed fs-4"></i>
        </div>
        <h3 class="section-heading-serif mb-2" style="font-size: 40px;">Отменить бронирование?</h3>
        <p class="text-muted mb-2">Вы собираетесь полностью отменить бронь на рейс:</p>
        <div class="p-3 mb-4 rounded-3 mono-code fw-bold" style="background: var(--color-canvas); border: 1px solid var(--color-edge-alpha);">
            {{ object.flight }}
        </div>

        <form method="post" class="d-flex justify-content-center gap-2 flex-wrap">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, отменить бронь</button>
            <a href="{% url 'flights:reservation_list' %}" class="btn btn-outline-secondary">Вернуться назад</a>
        </form>
    </div>
</div>
{% endblock %}
