<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publisher detail</title>
</head>

<body>
  <h1>{{ object }}</h1>
  <p>Car with <strong>id</strong> {{ object.id }} has:
      <li><strong>number:</strong> {{ object.number }} </li>
      <li><strong>brand:</strong> {{ object.brand }} </li>
      <li><strong>model:</strong> {{ object.model }} </li>
      <li><strong>color:</strong> {{ object.color }} </li>
  </p>
  <a href="/car/">Get back</a>
</body>
</html>
