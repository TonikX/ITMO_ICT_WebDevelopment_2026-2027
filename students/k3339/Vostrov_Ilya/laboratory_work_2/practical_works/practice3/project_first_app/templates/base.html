<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Автовладельцы{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    main { max-width: 760px; margin: 2rem auto; }
    .card { border-radius: .75rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container" style="max-width:760px">
      <a class="navbar-brand" href="{% url 'people_list' %}">🚗 Автовладельцы</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'car_list' %}">Автомобили</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Регистрация</a></li>
        {% if user.is_authenticated %}
          <li class="nav-item">
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button class="btn btn-outline-light btn-sm mt-1">Выйти ({{ user.username }})</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item mt-1"><a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Войти</a></li>
        {% endif %}
      </ul>
    </div>
  </nav>
  <main>
    {% if messages %}
      {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
