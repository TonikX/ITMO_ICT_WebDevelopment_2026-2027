
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автомобили</title>
</head>
<body>
    <h1>Список автомобилей</h1>

    <p>
        <a href="{% url 'car_create' %}">Добавить автомобиль</a>
    </p>

    <ul>
        {% for car in object_list %}
            <li>
                <a href="{% url 'car_detail' car.id %}">
                    {{ car.brand }} {{ car.model_name }}
                </a>

                — {{ car.plate_number }}

                <a href="{% url 'car_update' car.id %}">
                    Редактировать
                </a>
                <a href="{% url 'car_delete' car.id %}">
                    Удалить
                </a>
            </li>
        {% empty %}
            <li>Автомобилей пока нет</li>
        {% endfor %}
    </ul>

    <a href="{% url 'owner_list' %}">Список владельцев</a>
</body>
</html>
