[project]
name = "homework-board"
version = "0.1.0"
description = "Лабораторная работа №2: Доска домашних заданий (Django)"
requires-python = ">=3.9"
dependencies = [
    "Django>=4.2,<5.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "config"]
