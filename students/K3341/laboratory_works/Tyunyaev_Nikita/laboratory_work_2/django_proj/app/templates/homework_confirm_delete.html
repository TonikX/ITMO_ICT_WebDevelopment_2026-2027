{% extends "base.html" %}

{% block title %}Удаление задания{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="card-title mb-0 fs-6 fw-bold">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Подтверждение удаления
                </h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 mb-3">Вы действительно хотите удалить задание <strong>«{{ object.title }}»</strong>?</p>
                <p class="text-muted small mb-4">Все связанные сдачи и оценки учеников будут также безвозвратно удалены.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'homework_detail' object.pk %}" class="btn btn-outline-secondary px-4">Отмена</a>
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
