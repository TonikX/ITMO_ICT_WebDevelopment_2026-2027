<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Автогонки{% endblock %}</title><link rel="stylesheet" href="{{ static('style.css') }}"></head>
<body>
<header><nav>
<a href="{{ url('race_list') }}">Автогонки</a>
{% if request.user.is_authenticated %}
<a href="{{ url('my_registrations') }}">Мои регистрации</a>
{% if request.user.is_staff or request.user.is_superuser %}<a href="{{ url('admin:index') }}">Администрирование</a>{% endif %}
<span>{{ request.user.username }}</span>
<form method="post" action="{{ url('logout') }}">{{ csrf_input }}<button>Выйти</button></form>
{% else %}<a href="{{ url('login') }}">Вход</a><a href="{{ url('register') }}">Регистрация</a>{% endif %}
</nav></header>
<main>{% block content %}{% endblock %}</main>
</body></html>
