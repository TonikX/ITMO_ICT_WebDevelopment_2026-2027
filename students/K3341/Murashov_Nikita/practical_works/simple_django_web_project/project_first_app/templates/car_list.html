{% extends "base.html" %}
{% block content %}
<h1>Автомобили</h1>
<form method="get">
  <input name="brand" placeholder="Марка" value="{{ request.GET.brand }}">
  <button>Фильтр</button>
</form>
<table>
  <tr><th>Гос. номер</th><th>Марка</th><th>Модель</th><th>Цвет</th><th></th></tr>
  {% for car in cars %}
  <tr>
    <td><a href="{% url 'car_detail' car.pk %}">{{ car.state_number }}</a></td>
    <td>{{ car.brand }}</td>
    <td>{{ car.model }}</td>
    <td>{{ car.color|default:"—" }}</td>
    <td>
      <a href="{% url 'car_update' car.pk %}">изменить</a>
      <a href="{% url 'car_delete' car.pk %}">удалить</a>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="5">Нет автомобилей.</td></tr>
  {% endfor %}
</table>
{% endblock %}
