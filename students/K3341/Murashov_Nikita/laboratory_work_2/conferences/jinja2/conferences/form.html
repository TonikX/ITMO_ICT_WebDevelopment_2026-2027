{% extends "conferences/base.html" %}
{% from "conferences/macros.html" import render_form %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card"><div class="card-body">
      <h1 class="h4 mb-4">{{ title }}</h1>
      <form method="post">
        {{ csrf_input }}
        {{ render_form(form) }}
        <button class="btn btn-primary">Сохранить</button>
        <a class="btn btn-link" href="{{ request.META.get('HTTP_REFERER') or url('conference-list') }}">Отмена</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
