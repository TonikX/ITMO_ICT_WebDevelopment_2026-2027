{% extends "conferences/base.html" %}
{% block title %}Удаление{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card"><div class="card-body">
      <h1 class="h4">Удалить «{{ object }}»?</h1>
      <p class="text-muted">{{ warning or "Действие необратимо." }}</p>
      <form method="post">
        {{ csrf_input }}
        <button class="btn btn-danger">Удалить</button>
        <a class="btn btn-link" href="{{ request.META.get('HTTP_REFERER') or url('conference-list') }}">Отмена</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
