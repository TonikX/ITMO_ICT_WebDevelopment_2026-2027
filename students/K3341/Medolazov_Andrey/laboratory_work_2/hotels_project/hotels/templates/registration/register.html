{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h1 class="h4 mb-3">Регистрация</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <button class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>
                <p class="text-center mt-3 mb-0 small">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
