{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h1 class="h4 mb-3">Вход</h1>
                {% if form.errors %}
                    <div class="alert alert-danger">Неверный логин или пароль</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Логин</label>
                        <input type="text" name="username" id="id_username" class="form-control" value="{{ form.username.value|default:'' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Пароль</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Войти</button>
                </form>
                <p class="text-center mt-3 mb-0 small">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
