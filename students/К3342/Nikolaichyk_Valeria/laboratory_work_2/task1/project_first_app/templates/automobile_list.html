<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список автомобилей</title>
</head>
<body>
    <h1>Список автомобилей</h1>

    <ul>
        {% for automobile in automobiles %}
            <li>
                {{ automobile.brand }} {{ automobile.model }}
                — номер: {{ automobile.registration_number }}
                — цвет: {{ automobile.color }}
            </li>
        {% empty %}
            <li>Автомобилей пока нет.</li>
        {% endfor %}
    </ul>
</body>
</html>
