{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">
{% if page.has_previous() %}<a href="?{{ query }}&page={{ page.previous_page_number() }}">← Назад</a>{% endif %}
<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
{% if page.has_next() %}<a href="?{{ query }}&page={{ page.next_page_number() }}">Далее →</a>{% endif %}
</nav>{% endif %}
