{% extends 'hotels_app/base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-4">{{ action }} для "{{ hotel.name }}"</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Тип номера</label>
                    <input type="text" name="room_type" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Цена за ночь</label>
                    <input type="number" step="0.01" name="price" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Вместимость (чел.)</label>
                    <input type="number" name="capacity" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'hotel_detail' hotel.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
