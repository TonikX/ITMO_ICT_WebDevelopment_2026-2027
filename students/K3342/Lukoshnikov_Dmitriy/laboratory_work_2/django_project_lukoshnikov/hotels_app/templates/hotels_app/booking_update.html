{% extends 'hotels_app/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Редактировать бронь</h2>
        <form method="post" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label>Дата заезда:</label>
                <input type="date" name="check_in" class="form-control" value="{{ booking.check_in|date:'Y-m-d' }}" required>
            </div>
            <div class="mb-3">
                <label>Дата выезда:</label>
                <input type="date" name="check_out" class="form-control" value="{{ booking.check_out|date:'Y-m-d' }}" required>
            </div>
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{% url 'my_bookings' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
