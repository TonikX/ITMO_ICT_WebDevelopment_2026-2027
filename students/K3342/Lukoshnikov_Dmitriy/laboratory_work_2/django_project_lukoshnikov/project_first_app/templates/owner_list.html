<h1>Список владельцев</h1>
<a href="{% url 'owner_create' %}">Добавить владельца</a>
<ul>
    {% for owner in owners %}
        <li><a href="{% url 'owner_detail' owner.id %}">{{ owner.last_name }} {{ owner.first_name }}</a></li>
    {% empty %}
        <li>Владельцев пока нет.</li>
    {% endfor %}
</ul>
