services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flightboard}
      POSTGRES_USER: ${POSTGRES_USER:-flightboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightboard-local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - flightboard_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  flightboard_data:
