<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Табло авиаперелётов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'flight_list' %}">✈️ Авиаперелёты</a>
        <div class="navbar-nav ms-auto align-items-center">
            {% if user.is_authenticated %}
                <span class="navbar-text me-3">{{ user.username }}
                    {% if user.is_staff %}<span class="badge bg-warning text-dark">ADMIN</span>{% endif %}
                </span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
                    <button class="btn btn-sm btn-outline-light">Выйти</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Войти</a>
                <a class="nav-link" href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
