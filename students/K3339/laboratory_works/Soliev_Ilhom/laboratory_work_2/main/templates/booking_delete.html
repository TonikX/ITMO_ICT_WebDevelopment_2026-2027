{% extends 'base.html' %}
{% block title %}Удаление бронирования{% endblock %}
{% block content %}
<section class="panel form-panel">
    <h1>Удалить бронирование?</h1>
    <p>Тур «{{ booking.tour.title }}», {{ booking.tour.start_date|date }} — {{ booking.tour.end_date|date }}.</p>
    <form method="post" class="actions">
        {{ csrf_input }}
        <button type="submit" class="danger">Удалить</button>
        <a href="{{ url('my_bookings') }}">Оставить бронирование</a>
    </form>
</section>
{% endblock %}
