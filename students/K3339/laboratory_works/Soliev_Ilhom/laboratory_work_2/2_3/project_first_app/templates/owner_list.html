<h1>Автовладельцы</h1>

<nav>
    <a href="{% url 'owner_create' %}">Добавить владельца</a>
    <a href="{% url 'car_list' %}">Автомобили</a>
</nav>

<ul>
    {% for owner in owners %}
        <li>
            <a href="{% url 'owner_detail' owner.id %}">
                {{ owner.get_full_name|default:owner.username }}
            </a>
            {% if owner.nationality %} — {{ owner.nationality }}{% endif %}
        </li>
    {% empty %}
        <li>Владельцев пока нет.</li>
    {% endfor %}
</ul>
