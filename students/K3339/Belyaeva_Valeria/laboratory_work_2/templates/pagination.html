{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы"><span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span><div>{% if page.has_previous() %}<a href="?{{ query }}&page={{ page.previous_page_number() }}#schedule" aria-label="Предыдущая страница">←</a>{% endif %}{% for number in page.paginator.page_range %}<a class="{{ 'current' if page.number == number else '' }}" href="?{{ query }}&page={{ number }}#schedule">{{ number }}</a>{% endfor %}{% if page.has_next() %}<a href="?{{ query }}&page={{ page.next_page_number() }}#schedule" aria-label="Следующая страница">→</a>{% endif %}</div></nav>{% endif %}
