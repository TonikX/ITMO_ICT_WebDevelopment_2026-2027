{% extends 'base.html' %}{% block content %}<div class="container page-content"><span class="eyebrow">ПРАКТИКА 2.2 · CBV</span><h1 class="page-title">Автомобили</h1><div class="practice-links"><a class="button" href="{{ url('car_create') }}">Новый автомобиль</a><a class="button button-outline" href="{{ url('owner_list') }}">Владельцы</a></div><div class="panel table-wrap"><table><thead><tr><th>Номер</th><th>Автомобиль</th><th>Цвет</th><th>Действия</th></tr></thead><tbody>{% for car in cars %}<tr><td><a class="inline-link" href="{{ url('car_detail', args=[car.pk]) }}">{{ car.registration_number }}</a></td><td>{{ car.brand }} {{ car.model }}</td><td>{{ car.color }}</td><td><a href="{{ url('car_update', args=[car.pk]) }}">Изменить</a> · <a href="{{ url('car_delete', args=[car.pk]) }}">Удалить</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
