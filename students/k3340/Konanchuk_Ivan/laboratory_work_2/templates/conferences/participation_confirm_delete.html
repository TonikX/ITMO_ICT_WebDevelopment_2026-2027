{% extends 'base.html' %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h2 class="h4">Удалить регистрацию?</h2>
            <p>Доклад «{{ object.talk_title }}» на конференции «{{ object.conference.name }}».</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'my_participations' %}" class="btn btn-link">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
