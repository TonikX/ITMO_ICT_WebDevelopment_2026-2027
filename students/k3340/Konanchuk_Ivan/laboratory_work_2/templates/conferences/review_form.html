{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body form-box">
                    <h2 class="h4">Отзыв о конференции</h2>
                    <p class="text-muted">
                        {{ conference.name }}, {{ conference.start_date|date:"d.m.Y" }} - {{ conference.end_date|date:"d.m.Y" }}
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        {% include 'form_fields.html' %}
                        <button type="submit" class="btn btn-primary">Отправить</button>
                        <a href="{% url 'conference_detail' conference.pk %}" class="btn btn-link">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
