{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body form-box">
                    <h2 class="h4">{% if object %}Изменение регистрации{% else %}Регистрация доклада{% endif %}</h2>
                    <p class="text-muted">{{ conference.name }}</p>
                    <form method="post">
                        {% csrf_token %}
                        {% include 'form_fields.html' %}
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a href="{% url 'conference_detail' conference.pk %}" class="btn btn-link">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
