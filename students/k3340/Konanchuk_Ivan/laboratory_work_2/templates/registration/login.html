{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body form-box">
                    <h2 class="h4 mb-3">Вход</h2>
                    <form method="post">
                        {% csrf_token %}
                        {% include 'form_fields.html' %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                    <p class="mt-3 mb-0">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a></p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
