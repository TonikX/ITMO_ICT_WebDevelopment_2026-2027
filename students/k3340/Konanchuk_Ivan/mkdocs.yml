site_name: Веб-программирование. Конанчук Иван. К3340

theme:
  name: material
  language: ru

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - ЛР1:
      - Отчёт: lr1/report.md
  - ЛР2:
      - Отчёт: lr2/report.md
