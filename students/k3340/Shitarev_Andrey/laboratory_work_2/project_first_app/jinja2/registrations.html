{% extends 'base.html' %}{% block content %}<h1>Мои регистрации</h1>{% for registration in registrations %}<article class="card"><h2><a href="/races/{{ registration.race.pk }}/">{{ registration.race.name }}</a></h2><p>{{ registration.race.date }} · {{ registration.note }}</p><a href="/registrations/{{ registration.pk }}/edit/">Изменить</a><form method="post" action="/registrations/{{ registration.pk }}/delete/" onsubmit="return confirm('Удалить регистрацию?')"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><button>Удалить</button></form></article>{% else %}<p>Вы пока не зарегистрированы на гонки.</p>{% endfor %}{% endblock %}
