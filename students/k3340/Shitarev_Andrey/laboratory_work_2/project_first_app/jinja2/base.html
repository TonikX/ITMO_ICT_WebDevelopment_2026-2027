<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Автогонки{% endblock %}</title><link rel="stylesheet" href="/static/project_first_app/style.css"></head>
<body><header><div class="wrap"><a class="brand" href="/">Табло автогонок</a><nav><a href="/">Гонки</a>{% if request.user.is_authenticated %}<a href="/profile/">Профиль</a><a href="/registrations/">Мои регистрации</a>{% if request.user.is_staff %}<a href="/races/new/">Добавить гонку</a><a href="/admin/">Администрирование</a>{% endif %}<form method="post" action="/logout/"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><button>Выйти ({{ request.user.username }})</button></form>{% else %}<a href="/login/">Вход</a><a href="/signup/">Регистрация</a>{% endif %}</nav></div></header><main class="wrap">{% block content %}{% endblock %}</main></body></html>
