<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Автовладельцы{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Автовладельцы</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'owner_list' %}">Владельцы</a></li>

      <li class="nav-item"><a class="nav-link" href="{% url 'car_create' %}">Добавить автомобиль</a></li>
    </ul>
    <a class="btn btn-outline-light btn-sm" href="/admin/">Админ-панель</a>

</nav>
<main class="container">
  {% block content %}{% endblock %}
