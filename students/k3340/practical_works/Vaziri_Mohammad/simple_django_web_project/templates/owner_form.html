{% extends "base.html" %}
{% block title %}Новый владелец{% endblock %}
{% block content %}
<h1 class="h3">Новый автовладелец</h1>
<p class="text-muted">Владелец создаётся как пользователь системы: логин, пароль и данные из практики 2.3.</p>
<form method="POST" class="card card-body bg-white" style="max-width: 640px">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
