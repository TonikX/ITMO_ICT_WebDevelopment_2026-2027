{% extends "base.html" %}
{% block title %}{% if object %}Изменение автомобиля{% else %}Новый автомобиль{% endif %}{% endblock %}
{% block content %}
<h1 class="h3">{% if object %}Изменение: {{ object }}{% else %}Новый автомобиль{% endif %}</h1>
<form method="post" class="card card-body bg-white" style="max-width: 520px">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
<a class="d-inline-block mt-3" href="{% url 'car_list' %}">← Все автомобили</a>
{% endblock %}
