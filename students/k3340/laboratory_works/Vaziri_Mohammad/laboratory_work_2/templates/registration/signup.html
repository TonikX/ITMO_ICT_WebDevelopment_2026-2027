{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Регистрация</h1>
    <p class="text-muted">Аккаунт нужен, чтобы регистрироваться на гонки и оставлять комментарии.</p>
    <form method="post" class="card card-body">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-warning">Создать аккаунт</button>
    </form>
  </div>
</div>
{% endblock %}
