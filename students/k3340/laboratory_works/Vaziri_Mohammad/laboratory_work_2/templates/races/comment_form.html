{% extends "base.html" %}
{% block title %}Отзыв о гонке{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h1 class="h3 mb-1">Отзыв о гонке</h1>
    <p class="text-muted">{{ race.title }}, {{ race.date|date:"d.m.Y" }}</p>
    <form method="post" class="card card-body">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">Отправить</button>
        <a class="btn btn-link" href="{% url 'race_detail' race.pk %}">К гонке</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
