<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Автомобили</title>
</head>

<body>
    <h1>Автомобили</h1>
    <a href="{% url 'car_create' %}">Добавить автомобиль</a>
    <ul>
        {% for car in cars %}
        <li>
            <a href="{% url 'car_detail' car.id %}">{{ car }}</a>
        </li>
        {% empty %}
        <li>Автомобилей пока нет.</li>
        {% endfor %}
    </ul>
</body>

</html>
