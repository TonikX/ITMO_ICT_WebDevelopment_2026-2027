<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Владельцы</title>
</head>

<body>
    <h1>Владельцы автомобилей</h1>
    <a href="{% url 'owner_create' %}">Добавить владельца</a>
    <ul>
        {% for owner in owners %}
        <li>
            <a href="{% url 'owner_detail' owner.id %}">
                {{ owner }}
            </a>
        </li>
        {% empty %}
        <li>Владельцев пока нет.</li>
        {% endfor %}
    </ul>
</body>

</html>
