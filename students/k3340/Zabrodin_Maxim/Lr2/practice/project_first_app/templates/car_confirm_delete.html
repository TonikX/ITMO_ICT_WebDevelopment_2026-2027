<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Удаление автомобиля</title>
</head>

<body>
    <h1>Удаление автомобиля</h1>
    <p>Удалить {{ object }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>

    <a href="{% url 'car_detail' object.id %}">Отмена</a>
</body>

</html>
