<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Журнал оценок</title>
</head>

<body>
    <h1>Журнал оценок</h1>

    <form method="POST" action="/">
        <p>
            <label>
                Дисциплина:
                <input name="subject" required>
            </label>
        </p>
        <p>
            <label>
                Оценка:
                <input type="number" name="grade" min="1" max="5" required>
            </label>
        </p>
        <button type="submit">Добавить</button>
    </form>

    <h2>Оценки по дисциплинам</h2>
    <table border="1">
        <tr>
            <th>Дисциплина</th>
            <th>Оценки</th>
        </tr>
        {{rows}}
    </table>
</body>

</html>
