<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ car }}</title>
</head>
<body>
    <h1>{{ car }}</h1>
    <p>Гос. номер: {{ car.plate_number }}</p>
    <p>Марка: {{ car.brand }}</p>
    <p>Модель: {{ car.car_model }}</p>
    <p>Цвет: {{ car.get_color_display }}</p>

    <h2>Владельцы</h2>
    <ul>
        {% for owner in car.owners.all %}
            <li><a href="{% url 'owner_detail' owner.id %}">{{ owner }}</a></li>
        {% empty %}
            <li>Владельцев нет.</li>
        {% endfor %}
    </ul>

    <p><a href="{% url 'car_edit' car.id %}">Редактировать</a> |
       <a href="{% url 'cars_list' %}">К списку автомобилей</a></p>
</body>
</html>
