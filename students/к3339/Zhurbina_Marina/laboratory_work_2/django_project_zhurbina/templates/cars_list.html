<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автомобили</title>
</head>
<body>
    <h1>Автомобили</h1>
    <p><a href="{% url 'car_create' %}">Добавить автомобиль</a></p>
    <table border="1">
        <tr>
            <th>Автомобиль</th>
            <th>Цвет</th>
            <th>Владельцы</th>
            <th></th>
        </tr>
        {% for car in cars %}
        <tr>
            <td>{{ car }}</td>
            <td>{{ car.get_color_display }}</td>
            <td>
                {% for owner in car.owners.all %}
                    {{ owner }}{% if not forloop.last %}, {% endif %}
                {% endfor %}
            </td>
            <td><a href="{% url 'car_edit' car.id %}">редактировать</a> |
                <a href="{% url 'car_delete' car.id %}">удалить</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Автомобилей пока нет.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
