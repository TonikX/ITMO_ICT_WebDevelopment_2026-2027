{% if page_obj.has_other_pages() %}
    <nav class="pagination" aria-label="Страницы домашних заданий">
        {% if page_obj.has_previous() %}
            <a class="button secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number() }}">Назад</a>
        {% else %}
            <span class="pagination-disabled">Назад</span>
        {% endif %}
        <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next() %}
            <a class="button secondary" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number() }}">Далее</a>
        {% else %}
            <span class="pagination-disabled">Далее</span>
        {% endif %}
    </nav>
{% endif %}
