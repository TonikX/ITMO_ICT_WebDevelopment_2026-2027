{% extends 'homework/base.html' %}
{% block title %}Регистрация ученика · Доска домашних заданий{% endblock %}
{% block content %}
<h1>Регистрация ученика</h1>
<p>Заполните данные и выберите свою учебную группу.</p>
<form method="post" class="account-form">
    {{ csrf_input }}
    {{ form.as_p() }}
    <button type="submit" class="button">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="{{ url('homework:login') }}">Войти</a></p>
{% endblock %}
