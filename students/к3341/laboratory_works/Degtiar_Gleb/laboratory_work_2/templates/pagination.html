{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">
{% if page_obj.has_previous() %}<a href="{{ page_url(request,page_obj.previous_page_number()) }}">← Назад</a>{% endif %}
<span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next() %}<a href="{{ page_url(request,page_obj.next_page_number()) }}">Далее →</a>{% endif %}</nav>{% endif %}
