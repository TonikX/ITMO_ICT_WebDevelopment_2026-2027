{% extends 'base.html' %}{% block content %}<span class="eyebrow">ПРАКТИКА 2.2 / CBV</span><h1>Автомобили</h1><p><a class="button" href="{{ url('car_create') }}">Добавить автомобиль</a> <a class="secondary-link" href="{{ url('owners') }}">Владельцы</a></p><form class="filters" method="get"><div><label for="q">Марка</label><input id="q" name="q" value="{{ request.GET.get('q','') }}"></div><button>Найти</button></form>{% for car in object_list %}<article class="review"><a href="{{ url('car_detail',kwargs={'pk':car.pk}) }}">{{ car }}</a> · <a href="{{ url('car_edit',kwargs={'pk':car.pk}) }}">Изменить</a> · <a href="{{ url('car_delete',kwargs={'pk':car.pk}) }}">Удалить</a></article>{% else %}<p>Автомобилей нет.</p>{% endfor %}{% include 'pagination.html' %}{% endblock %}
