site_name: Веб-программирование · Данилевский Тимур · K3339
site_description: Лабораторная работа № 2. Вариант 6 — табло победителей автогонок.
site_author: Данилевский Тимур Давидович
site_url: https://K1ll4a.github.io/ITMO_ICT_WebDevelopment_2026-2027/
repo_url: https://github.com/K1ll4a/ITMO_ICT_WebDevelopment_2026-2027
repo_name: K1ll4a/ITMO_ICT_WebDevelopment_2026-2027
theme:
  name: material
  language: ru
  palette:
    scheme: default
    primary: black
    accent: deep orange
  font:
    text: Golos Text
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - Главная: index.md
  - ЛР1 · Работа с сокетами:
    - Отчёт: lr1/report.md
  - ЛР2 · Табло автогонок:
    - Отчёт: lr2/report.md
    - Модель данных: lr2/models.md
    - Реализация: lr2/implementation.md
    - Интерфейсы: lr2/interfaces.md
    - Проверка и защита: lr2/testing.md
    - Запуск и сдача: lr2/submission.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/extra.css
