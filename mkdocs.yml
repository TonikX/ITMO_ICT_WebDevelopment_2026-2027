site_name: Веб-программирование. Мурашов Никита. K3341
theme:
  name: material
  language: ru
nav:
  - Главная: index.md
  - ЛР1:
      - Отчёт: lr1/report.md
  - ЛР2:
      - Отчёт: lr2/report.md
