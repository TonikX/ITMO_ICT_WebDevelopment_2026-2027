name: Publish MkDocs
on:
  push:
    branches: [codex/lab1-afanasyev]
    paths:
      - mkdocs.yml
      - students/k3340/laboratory_works/Afanasyev_Dmitry/laboratory_work_1/docs/**
      - students/k3340/laboratory_works/Afanasyev_Dmitry/laboratory_work_1/requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lab1-afanasyev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r students/k3340/laboratory_works/Afanasyev_Dmitry/laboratory_work_1/requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4