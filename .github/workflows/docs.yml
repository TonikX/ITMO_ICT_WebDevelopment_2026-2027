name: Publish MkDocs

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - students/K3341/Medolazov_Andrey/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mkdocs
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'THEAM57/ITMO_ICT_WebDevelopment_2026-2027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - name: Configure Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish reports
        run: mkdocs gh-deploy --force
